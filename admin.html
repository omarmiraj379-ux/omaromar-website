<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Private Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f5f7;
      padding: 20px;
    }

    .panel {
      max-width: 750px;
      margin: 20px auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
    }

    input, textarea, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      box-sizing: border-box;
    }

    button {
      background: #176b3a;
      color: white;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }

    .request {
      border: 1px solid #ddd;
      padding: 15px;
      margin: 15px 0;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>

<div class="panel">
  <h2>Admin Login</h2>

  <form id="loginForm">
    <input id="email" type="email"
      placeholder="Admin email" required>

    <input id="password" type="password"
      placeholder="Password" required>

    <button type="submit">Login</button>
  </form>

  <p id="loginStatus"></p>

  <div id="dashboard" hidden>
    <h2>Customer Messages</h2>
    <button id="logout">Logout</button>
    <div id="requests"></div>
  </div>
</div>

<script type="module">
import { db, auth } from "./firebase.js";

import {
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

import {
  collection,
  query,
  orderBy,
  onSnapshot,
  addDoc,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const ADMIN_UID = "cbsIjD78cHSRK21cTERvU8e6xi23";

const loginForm = document.getElementById("loginForm");
const dashboard = document.getElementById("dashboard");
const status = document.getElementById("loginStatus");
const requestsDiv = document.getElementById("requests");

let stopListening = null;

loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  status.textContent = "Logging in...";

  try {
    await signInWithEmailAndPassword(
      auth,
      document.getElementById("email").value,
      document.getElementById("password").value
    );
    status.textContent = "";
  } catch (error) {
    status.textContent = "Login failed. Check your details.";
  }
});

onAuthStateChanged(auth, (user) => {
  if (stopListening) {
    stopListening();
    stopListening = null;
  }

  if (user && user.uid === ADMIN_UID) {
    loginForm.hidden = true;
    dashboard.hidden = false;
    status.textContent = "";

    const q = query(
      collection(db, "requests"),
      orderBy("createdAt", "desc")
    );

    stopListening = onSnapshot(q, (snapshot) => {
      requestsDiv.replaceChildren();

      if (snapshot.empty) {
        requestsDiv.textContent = "No customer messages yet.";
      }

      snapshot.forEach((item) => {
        const data = item.data();

        const card = document.createElement("div");
        card.className = "request";

        const title = document.createElement("h3");
        title.textContent = data.name || "Customer";

        const details = document.createElement("p");
        details.textContent =
          "Phone: " + data.phone +
          " | Email: " + data.email;

        const message = document.createElement("p");
        message.textContent = "Message: " + data.message;

        const currentStatus = document.createElement("p");
        currentStatus.textContent = "Status: " + data.status;

        const reply = document.createElement("textarea");
        reply.placeholder = "Write your reply...";

        const send = document.createElement("button");
        send.textContent = "Send Reply";

        send.addEventListener("click", async () => {
          if (!reply.value.trim()) return;

          send.disabled = true;

          try {
            await addDoc(
              collection(db, "requests", item.id, "replies"),
              {
                text: reply.value.trim(),
                createdAt: new Date()
              }
            );

            await updateDoc(
              doc(db, "requests", item.id),
              { status: "Replied" }
            );

            reply.value = "";
            alert("Reply submitted. Email delivery will be handled by the server.");
          } catch (error) {
            alert("Could not submit reply.");
            console.error(error);
          }

          send.disabled = false;
        });

        card.append(title, details, message, currentStatus, reply, send);
        requestsDiv.appendChild(card);
      });
    }, (error) => {
      status.textContent = "Could not load messages: " + error.message;
    });

  } else {
    loginForm.hidden = false;
    dashboard.hidden = true;
    requestsDiv.replaceChildren();

    if (user) {
      status.textContent = "This account is not authorized.";
    }
  }
});

document.getElementById("logout").addEventListener("click", () => {
  signOut(auth);
});
</script>

</body>
</html>
